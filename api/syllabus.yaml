      properties:
        id:
          type: integer
          readonly: true
        academic_year_id:
          type: integer
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
        modified_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
      required:
