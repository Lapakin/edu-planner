components:
  parameters:
    Authorization:
      name: token
      in: header
      schema:
        type: string
        format: string
      required: true

  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          description: Status code
        message:
          type: string
          description: Error description

    AcademicYear:
      type: object
      properties:
        id:
          type: integer
          readonly: true
        name:
          type: string
        date_start:
          type: string
          format: date
          example: '2024-09-01'
        date_end:
          type: string
          format: date
          example: '2025-06-30'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
        modified_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
      required:
        - name
        - date_start
        - date_end

    Semester:
      type: object
      properties:
        id:
          type: integer
          readonly: true
        academic_year_id:
          type: integer
        period_start:
          type: string
          format: date
          example: '2024-09-01'
        period_end:
          type: string
          format: date
          example: '2025-06-30'
        created_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
        modified_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
      required:
        - academic_year_id
        - period_start
        - period_end

    Department:
      type: object
      properties:
        id:
          type: integer
          readonly: true
        academic_year_id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
        modified_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
      required:
        - academic_year_id
        - name

    Room:
      type: object
      properties:
        id:
          type: integer
          readonly: true
        academic_year_id:
          type: integer
        name:
          type: string
        room_type:
          type: string
        created_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
        modified_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
      required:
        - academic_year_id
        - name
        - room_type

    Specialty:
      type: object
      properties:
        id:
          type: integer
          readonly: true
        academic_year_id:
          type: integer
        department_id:
          type: integer
        name:
          type: string
        short_name:
          type: string
        specialty_code:
          type: string
        created_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
        modified_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
      required:
        - academic_year_id
        - department_id
        - name
        - short_name
        - specialty_code

    CycleCommittee:
      type: object
      properties:
        id:
          type: integer
          readonly: true
        academic_year_id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
        modified_at:
          type: string
          format: date-time
          readonly: true
          example: '2024-06-01T12:00:00Z'
      required:
        - academic_year_id
        - user_id
        - name

    Teacher:
