<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPlanner — Встановлення пароля</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .set-password-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-secondary, #f1f5f9);
    }
    .set-password-card {
      background: var(--bg-primary, #fff);
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
    }
    .set-password-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .set-password-logo .logo-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary, #1e293b);
    }
    .set-password-card h2 {
      margin: 0 0 24px;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-primary, #1e293b);
    }
    .set-password-card .form-field {
      margin-bottom: 16px;
    }
    .set-password-card .form-field label {
      display: block;
      margin-bottom: 6px;
      font-size: .88rem;
      font-weight: 500;
      color: var(--text-secondary, #475569);
    }
    .set-password-card .form-field input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 8px;
      font-size: .95rem;
      outline: none;
      box-sizing: border-box;
      background: var(--bg-input, #fff);
      color: var(--text-primary, #1e293b);
      transition: border-color .15s;
    }
    .set-password-card .form-field input:focus {
      border-color: var(--accent, #3b82f6);
    }
    .btn-full { width: 100%; }
    .error-msg {
      color: var(--danger, #ef4444);
      font-size: .85rem;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: rgba(239,68,68,.08);
      border-radius: 6px;
    }
    .success-msg {
      color: var(--success, #22c55e);
      font-size: .85rem;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: rgba(34,197,94,.08);
      border-radius: 6px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="set-password-page">
  <div class="set-password-card">
    <div class="set-password-logo">
      <svg viewBox="0 0 40 40" fill="none" style="width:36px;height:36px">
        <rect width="40" height="40" rx="8" fill="#3b82f6"/>
        <path d="M8 28L20 12L32 28H8Z" fill="white" opacity="0.9"/>
        <rect x="14" y="20" width="12" height="8" rx="1" fill="white" opacity="0.7"/>
      </svg>
      <span class="logo-text">EduPlanner</span>
    </div>

    <div id="expired-msg" class="error-msg hidden">
      Це посилання вже використано або закінчився термін його дії.
      Зверніться до адміністратора для отримання нового посилання.
    </div>

    <div id="form-section">
      <h2>Встановити пароль</h2>
      <p style="color:var(--text-muted,#64748b);font-size:.88rem;margin-bottom:20px">
        Введіть пароль для вашого облікового запису.
      </p>

      <div class="form-field">
        <label for="password">Новий пароль</label>
        <input type="password" id="password" autocomplete="new-password" placeholder="Мінімум 6 символів">
      </div>
      <div class="form-field">
        <label for="password-confirm">Підтвердіть пароль</label>
        <input type="password" id="password-confirm" autocomplete="new-password" placeholder="Повторіть пароль">
      </div>

      <div id="set-error" class="error-msg hidden"></div>
      <button id="set-btn" class="btn btn-primary btn-full">Зберегти пароль</button>
    </div>

    <div id="success-section" class="hidden">
      <div class="success-msg">Пароль успішно встановлено! Перенаправлення…</div>
    </div>
  </div>
</div>

<script>
  const TOKEN = '{{.token}}';

  document.addEventListener('DOMContentLoaded', () => {
    if (!TOKEN) {
      document.getElementById('form-section').classList.add('hidden');
      document.getElementById('expired-msg').classList.remove('hidden');
      return;
    }

    const btn = document.getElementById('set-btn');
    const errEl = document.getElementById('set-error');

    btn.addEventListener('click', async () => {
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('password-confirm').value;

      errEl.classList.add('hidden');

      if (!password || password.length < 6) {
        errEl.textContent = 'Пароль повинен містити мінімум 6 символів.';
        errEl.classList.remove('hidden');
        return;
      }
      if (password !== confirm) {
        errEl.textContent = 'Паролі не співпадають.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Збереження…';

      try {
        const resp = await fetch('/api/auth/set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: TOKEN, password }),
        });

        if (resp.status === 410) {
          document.getElementById('form-section').classList.add('hidden');
          document.getElementById('expired-msg').classList.remove('hidden');
          return;
        }

        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          throw new Error(data.error || 'Помилка сервера');
        }

        const data = await resp.json();
        if (data.token) {
          localStorage.setItem('token', data.token);
        }

        document.getElementById('form-section').classList.add('hidden');
        document.getElementById('success-section').classList.remove('hidden');

        setTimeout(() => { window.location.href = '/'; }, 1200);
      } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Зберегти пароль';
      }
    });

    document.getElementById('password-confirm').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btn.click();
    });
  });
</script>
</body>
</html>
