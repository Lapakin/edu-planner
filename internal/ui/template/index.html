<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPlanner</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- SVG ICON DEFINITIONS -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
  </symbol>
  <symbol id="icon-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
  </symbol>
  <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </symbol>
  <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
  </symbol>
  <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  </symbol>
  <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
  </symbol>
  <symbol id="icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
  </symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </symbol>
  <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
  </symbol>
  <symbol id="icon-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
  </symbol>
  <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
  </symbol>
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </symbol>
  <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
  </symbol>
  <symbol id="icon-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
  </symbol>
  <symbol id="icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
  </symbol>
  <symbol id="icon-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
  </symbol>
  <symbol id="icon-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
  </symbol>
  <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
  </symbol>
  <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 9 12 15 18 9"/>
  </symbol>
</svg>

<!-- ===== LOGIN PAGE ===== -->
<div id="login-page" class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="8" fill="#3b82f6"/>
        <path d="M8 28L20 12L32 28H8Z" fill="white" opacity="0.9"/>
        <rect x="14" y="20" width="12" height="8" rx="1" fill="white" opacity="0.7"/>
      </svg>
      <span class="logo-text">EduPlanner</span>
    </div>
    <h2 data-i18n="auth.loginTitle"></h2>
    <div class="form-field">
      <label for="login-email" data-i18n="auth.emailLabel"></label>
      <input type="email" id="login-email" autocomplete="email" data-i18n-placeholder="auth.emailLabel">
    </div>
    <div class="form-field">
      <label for="login-password" data-i18n="auth.passwordLabel"></label>
      <input type="password" id="login-password" autocomplete="current-password" data-i18n-placeholder="auth.passwordLabel">
    </div>
    <div id="login-error" class="error-msg hidden"></div>
    <button id="login-btn" class="btn btn-primary btn-full" data-i18n="auth.loginBtn"></button>
  </div>
</div>

<!-- ===== APP SHELL ===== -->
<div id="app-shell" class="app-shell hidden">

  <!-- HEADER -->
  <header id="app-header" class="app-header">
    <div class="header-left">
      <button id="sidebar-toggle" class="btn-icon" title="Toggle sidebar">
        <svg class="icon"><use href="#icon-menu"/></svg>
      </button>
      <div class="logo">
        <svg class="logo-icon-sm" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="8" fill="#3b82f6"/>
          <path d="M8 28L20 12L32 28H8Z" fill="white" opacity="0.9"/>
          <rect x="14" y="20" width="12" height="8" rx="1" fill="white" opacity="0.7"/>
        </svg>
        <span class="logo-text">EduPlanner</span>
      </div>
    </div>

    <div class="header-right">
      <!-- User email display; selectors kept hidden for JS state management -->
      <div class="header-context" id="header-context">
        <span id="header-email" class="header-email"></span>
        <div style="display:none">
          <select id="year-select"><option value=""></option></select>
          <select id="semester-select"><option value=""></option></select>
        </div>
      </div>

      <!-- Profile button → navigates to personal info page -->
      <a href="#/profile" class="profile-btn" id="profile-btn" data-i18n-aria="nav.profile">EP</a>
    </div>
  </header>

  <!-- BODY: SIDEBAR + CONTENT -->
  <div class="app-body">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <nav class="sidebar-nav">

        <!-- Main navigation -->
        <div class="sidebar-section-label" data-i18n="sidebar.mainNav"></div>
        <a href="#/home" class="nav-item" data-page="home"
           data-i18n-title="nav.home">
          <svg class="icon nav-icon"><use href="#icon-home"/></svg>
          <span class="nav-label" data-i18n="nav.home"></span>
        </a>
        <a href="#/academic-settings" class="nav-item" data-page="academic-settings"
           data-i18n-title="nav.academicSettings">
          <svg class="icon nav-icon"><use href="#icon-bell"/></svg>
          <span class="nav-label" data-i18n="nav.academicSettings"></span>
        </a>
        <a href="#/reference" class="nav-item" data-page="reference"
           data-i18n-title="nav.reference">
          <svg class="icon nav-icon"><use href="#icon-book"/></svg>
          <span class="nav-label" data-i18n="nav.reference"></span>
        </a>
        <a href="#/processing" class="nav-item" data-page="processing"
           data-i18n-title="nav.processing">
          <svg class="icon nav-icon"><use href="#icon-settings"/></svg>
          <span class="nav-label" data-i18n="nav.processing"></span>
        </a>
        <a href="#/schedule" class="nav-item" data-page="schedule"
           data-i18n-title="nav.schedule">
          <svg class="icon nav-icon"><use href="#icon-calendar"/></svg>
          <span class="nav-label" data-i18n="nav.schedule"></span>
        </a>
        <a href="#/users" class="nav-item admin-only hidden" data-page="users"
           data-i18n-title="nav.users">
          <svg class="icon nav-icon"><use href="#icon-users"/></svg>
          <span class="nav-label" data-i18n="nav.users"></span>
        </a>

      </nav>

      <!-- Sidebar bottom: language + logout -->
      <div class="sidebar-bottom">
        <div class="sidebar-lang-row" data-i18n-title="header.language">
          <svg class="icon nav-icon"><use href="#icon-globe"/></svg>
          <div class="sidebar-lang-toggle nav-label">
            <button class="lang-btn" data-lang="ua">UA</button>
            <button class="lang-btn" data-lang="en">EN</button>
          </div>
        </div>
        <button class="sidebar-logout-btn" id="sidebar-logout-btn"
                data-i18n-title="auth.logoutBtn">
          <svg class="icon nav-icon"><use href="#icon-logout"/></svg>
          <span class="nav-label" data-i18n="auth.logoutBtn"></span>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main id="main-content" class="main-content">
      <div class="loading-state">
        <div class="spinner"></div>
      </div>
    </main>

  </div>
</div>

<!-- ===== MODAL ===== -->
<div id="modal-overlay" class="modal-overlay hidden" onclick="closeModalOnOverlay(event)">
  <div id="modal" class="modal-dialog" role="dialog">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="btn-icon" onclick="closeModal()">
        <svg class="icon"><use href="#icon-x"/></svg>
      </button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-footer" class="modal-footer"></div>
  </div>
</div>

<!-- ===== CONFIRM DIALOG ===== -->
<div id="confirm-overlay" class="modal-overlay hidden">
  <div class="modal-dialog modal-sm">
    <div class="modal-header">
      <h3 id="confirm-title" data-i18n="actions.confirm"></h3>
    </div>
    <div class="modal-body">
      <p id="confirm-message"></p>
    </div>
    <div class="modal-footer">
      <button id="confirm-cancel" class="btn btn-secondary" data-i18n="actions.cancel"></button>
      <button id="confirm-ok" class="btn btn-danger" data-i18n="actions.confirm"></button>
    </div>
  </div>
</div>

<!-- ===== TOAST CONTAINER ===== -->
<div id="toast-container" class="toast-container"></div>

<!-- SCRIPTS -->
<script src="/static/js/i18n.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/entities.js"></script>
<script src="/static/js/table.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
