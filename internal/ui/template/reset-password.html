<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPlanner — Скидання пароля</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #F6F7FB;
      color: #111827;
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
    }
    .auth {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .auth-card {
      width: 100%; max-width: 400px;
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 14px;
      padding: 36px 32px;
      box-shadow: 0 4px 12px -2px rgba(17,24,39,.08);
    }
    .auth-brand {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 24px;
    }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 9px;
      background: #3B5BFF;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .brand-logo svg { width: 18px; height: 18px; }
    .brand-name { font-size: 16px; font-weight: 700; color: #111827; }

    .auth-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }
    .auth-sub { font-size: 13.5px; color: #6B7280; margin-bottom: 24px; }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12.5px; font-weight: 600; color: #1F2937;
      margin-bottom: 6px;
    }
    .field-input { position: relative; }
    .field input {
      width: 100%;
      padding: 11px 14px;
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      color: #111827;
      transition: border-color .12s, box-shadow .12s;
    }
    .field input:focus {
      outline: none;
      border-color: #3B5BFF;
      box-shadow: 0 0 0 3px #EEF1FF;
    }
    .field input::placeholder { color: #9CA3AF; }
    .field.has-eye input { padding-right: 40px; }
    .eye {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: #9CA3AF; cursor: pointer;
      background: transparent; border: 0; padding: 4px;
      display: grid; place-items: center;
    }
    .eye:hover { color: #1F2937; }

    .btn-primary {
      width: 100%;
      background: #3B5BFF; color: #fff; border: 0;
      padding: 12px 18px; border-radius: 8px;
      font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 6px;
      transition: background .12s, transform .1s;
    }
    .btn-primary:hover { background: #2E4AE6; }
    .btn-primary:active { transform: scale(.99); }
    .btn-primary:disabled { opacity: .65; cursor: not-allowed; }

    .error-msg {
      font-size: 13px; color: #ef4444;
      padding: 10px 12px;
      background: rgba(239,68,68,.07);
      border-radius: 6px; margin-bottom: 12px;
    }
    .success-msg {
      font-size: 13px; color: #16a34a;
      padding: 10px 12px;
      background: rgba(22,163,74,.08);
      border-radius: 6px; margin-bottom: 12px;
    }
    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
<div class="auth">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 4l8 14H4L12 4z" fill="#fff"/></svg>
      </div>
      <div class="brand-name">EduPlanner</div>
    </div>

    <div id="expired-msg" class="error-msg hidden">
      Це посилання вже використано або закінчився термін його дії.
      Зверніться до адміністратора для отримання нового посилання.
    </div>

    <div id="form-section">
      <h1 class="auth-title">Скинути пароль</h1>
      <p class="auth-sub">Введіть новий пароль для вашого облікового запису.</p>

      <div class="field has-eye">
        <label for="password">Новий пароль</label>
        <div class="field-input">
          <input type="password" id="password" autocomplete="new-password" placeholder="Мінімум 6 символів">
          <button class="eye" onclick="toggleEye('password', 'eye-pw')" aria-label="Показати пароль">
            <svg id="eye-pw" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field has-eye">
        <label for="password-confirm">Підтвердіть пароль</label>
        <div class="field-input">
          <input type="password" id="password-confirm" autocomplete="new-password" placeholder="Повторіть пароль">
          <button class="eye" onclick="toggleEye('password-confirm', 'eye-confirm')" aria-label="Показати пароль">
            <svg id="eye-confirm" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="reset-error" class="error-msg hidden"></div>
      <button id="reset-btn" class="btn-primary">Зберегти пароль</button>
    </div>

    <div id="success-section" class="hidden">
      <div class="success-msg">Пароль успішно змінено! Перенаправлення…</div>
    </div>
  </div>
</div>

<script>
  const TOKEN = '{{.token}}';

  function toggleEye(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);
    if (input.type === 'password') {
      input.type = 'text';
      eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      input.type = 'password';
      eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (!TOKEN) {
      document.getElementById('form-section').classList.add('hidden');
      document.getElementById('expired-msg').classList.remove('hidden');
      return;
    }

    const btn = document.getElementById('reset-btn');
    const errEl = document.getElementById('reset-error');

    btn.addEventListener('click', async () => {
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('password-confirm').value;

      errEl.classList.add('hidden');

      if (!password || password.length < 6) {
        errEl.textContent = 'Пароль повинен містити мінімум 6 символів.';
        errEl.classList.remove('hidden');
        return;
      }
      if (password !== confirm) {
        errEl.textContent = 'Паролі не співпадають.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Збереження…';

      try {
        const resp = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: TOKEN, password }),
        });

        if (resp.status === 410) {
          document.getElementById('form-section').classList.add('hidden');
          document.getElementById('expired-msg').classList.remove('hidden');
          return;
        }

        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          throw new Error(data.error || 'Помилка сервера');
        }

        const data = await resp.json();
        if (data.token) {
          localStorage.setItem('token', data.token);
        }

        document.getElementById('form-section').classList.add('hidden');
        document.getElementById('success-section').classList.remove('hidden');

        setTimeout(() => { window.location.href = '/'; }, 1200);
      } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Зберегти пароль';
      }
    });

    document.getElementById('password-confirm').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btn.click();
    });
  });
</script>
</body>
</html>
